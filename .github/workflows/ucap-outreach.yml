name: UCAP outreach send

# One-off scheduled send: backend/scripts/ucap_outreach/send.py, rows 2-278
# of contacts.csv (the North America block; rows 279-365 were already sent
# manually). Cron fires daily at 14:00 UTC (10:00 AM EDT) since GitHub
# Actions has no true one-time trigger, but the date guard below makes every
# firing except 2026-09-08 a no-op -- delete this workflow file after the
# real send completes instead of relying on the guard indefinitely.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test (preview to admin@resumaticai.com) or live (real send)"
        required: true
        default: "test"
        type: choice
        options: [test, live]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip unless today is the scheduled send date
        if: github.event_name == 'schedule'
        run: |
          today="$(date -u +%F)"
          if [ "$today" != "2026-09-08" ]; then
            echo "Not the scheduled date ($today) -- skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.SKIP != 'true'
        with:
          python-version: "3.12"

      - name: Send (scheduled -> live; manual dispatch -> chosen mode)
        if: env.SKIP != 'true'
        env:
          SMTP_HOST: mail.privateemail.com
          SMTP_PORT: "587"
          SMTP_USERNAME: admin@actuarialexamstutor.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd backend/scripts/ucap_outreach
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "test" ]; then
            python send.py --test
          else
            python send.py --live --start-row 2 --end-row 278
          fi
